name: Build APK

on:
  push:
    branches: [ master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'android/**'
  workflow_dispatch:

env:
  MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # v3 已坏：它跑在 Node20 上（GitHub 2026 强制 Node24），且默认要装 Google 已下架的
        # tools 包，表现就是在这一步 11 秒内直接失败。v4 迁到 Node24 并修了 removed tools package。
        uses: android-actions/setup-android@v4
        with:
          # 只声明真正需要的：compileSdk=34 的 platform。cmdline-tools 用默认值（22.0），
          # 不显式指定——每多传一个参数就多一个变量，这次踩坑就是这么来的。
          packages: 'platform-tools platforms;android-34'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download ASR model
        run: |
          set -euxo pipefail
          # assets/ 在仓库里不存在：Git 不跟踪空目录，它唯一的内容 models/ 被 .gitignore 排除。
          # 必须自己建，不能直接 cd（上一版就是这样 0 秒失败的）。
          mkdir -p android/app/src/main/assets/models
          cd android/app/src/main/assets/models
          echo "开始下载: $MODEL_URL"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
               --connect-timeout 30 --max-time 900 \
               -o model.tar.bz2 "$MODEL_URL"
          echo '--- 下载完成，包大小 ---'
          ls -lh model.tar.bz2

          tar xjf model.tar.bz2
          echo '--- 解压后顶层结构 ---'
          ls -la

          find . -mindepth 2 -type f -print0 | while IFS= read -r -d '' f; do
            mv "$f" .
          done
          find . -mindepth 1 -type d -empty -delete
          rm -f model.tar.bz2

          echo '--- 最终模型文件 ---'
          ls -lh

          for f in encoder-epoch-99-avg-1.int8.onnx decoder-epoch-99-avg-1.int8.onnx joiner-epoch-99-avg-1.int8.onnx tokens.txt; do
            if [ ! -f "$f" ]; then echo "缺少模型文件: $f"; exit 1; fi
          done
          echo '模型准备完毕'

      - name: Write local.properties
        working-directory: android
        env:
          # 没配 secret 时为空串：编译照过，只是运行时请求会失败
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "deepseek.api.key=${DEEPSEEK_API_KEY}" > local.properties
          echo "local.properties written (key length: ${#DEEPSEEK_API_KEY})"

      - name: Build debug APK
        working-directory: android
        run: |
          # Windows 上提交的文件会丢执行位
          chmod +x gradlew
          # 日志先落盘，失败时把它尾部 echo 出来。
          # 原因：GitHub 页面会把这一步的日志标记为 truncated，
          # 只有 annotation 那一小段是匿名可见的——那就把报错塞进那里。
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== Gradle 构建失败，下面是从日志里摘出的报错 ====="
            # Gradle 的报错通常在 FAILURE: 之后；找不到就退而打印末尾 120 行
            if grep -q 'FAILURE:' /tmp/gradle-build.log; then
              sed -n '/FAILURE:/,$p' /tmp/gradle-build.log | head -150
            else
              tail -120 /tmp/gradle-build.log
            fi
            echo "===== 报错摘录结束 ====="
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tingke-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
