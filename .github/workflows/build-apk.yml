name: Build APK

on:
  push:
    branches: [ master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'android/**'
  workflow_dispatch:

env:
  MODEL_TARBALL: sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2
  # 官方 Release（GitHub 直连，CI 上不用镜像）
  MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download ASR model
        run: |
          cd android/app/src/main/assets
          mkdir -p models
          cd models
          curl -fL --retry 3 -o model.tar.bz2 "$MODEL_URL"
          ls -lh model.tar.bz2
          tar xjf model.tar.bz2
          echo '--- 解压后顶层结构 ---'
          ls -la
          # 不假设顶层目录名：把解压出来的所有内容平铺到 models/
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -exec rm -rf {} +
          rm -f model.tar.bz2
          echo '--- 最终模型文件 ---'
          ls -lh
          # 缺文件就早失败，别等到运行时才炸
          for f in encoder-epoch-99-avg-1.int8.onnx decoder-epoch-99-avg-1.int8.onnx joiner-epoch-99-avg-1.int8.onnx tokens.txt; do
            test -f "$f" || { echo "缺少模型文件: $f"; exit 1; }
          done

      - name: Write local.properties
        working-directory: android
        env:
          # 没配 secret 时为空串：编译照过，只是运行时请求会失败
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          {
            echo "deepseek.api.key=${DEEPSEEK_API_KEY}"
          } > local.properties
          echo "local.properties written (key length: ${#DEEPSEEK_API_KEY})"

      - name: Build debug APK
        working-directory: android
        run: |
          # Windows 上提交的文件会丢执行位
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tingke-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
```

这里有个**必须先解决的前置问题**，否则 CI 一定会红：`android/gradle/wrapper/` 里**缺 `gradlew` 和 `gradle-wrapper.jar`**（你之前查过，只有 `gradle-wrapper.properties`）。CI 上跑 `./gradlew` 会直接报“没有这个文件”。我现在去本地补上这两个文件。

另外还有一处得你确认：`local.properties` 里读的 `deepseek.api.key`，CI 上这个文件不存在——我打算在 workflow 里写空值占位，保证编译能过但请求会失败（标记只落盘不出答案），**先验证编译和打包这条链路**。如果你要 CI 里带真 key，那得把 key 加进 GitHub Secrets，再改一行 workflow 从 `${{ secrets.DEEPSEEK_API_KEY }}` 生成 `local.properties`。你要哪种？

我先把 wrapper 补齐的活干了。

