name: Build APK

on:
  push:
    branches: [ master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'android/**'
  workflow_dispatch:

env:
  MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # v3 已坏：它跑在 Node20 上（GitHub 2026 强制 Node24），且默认要装 Google 已下架的
        # tools 包，表现就是在这一步 11 秒内直接失败。v4 迁到 Node24 并修了 removed tools package。
        uses: android-actions/setup-android@v4
        with:
          # 显式点名要装的包，不依赖 action 的默认清单（默认清单随版本变，是这次踩坑的根源）
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          cmdline-tools-version: '20.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download ASR model
        run: |
          cd android/app/src/main/assets
          mkdir -p models
          cd models
          curl -fL --retry 3 -o model.tar.bz2 "$MODEL_URL"
          ls -lh model.tar.bz2
          tar xjf model.tar.bz2
          echo '--- 解压后顶层结构 ---'
          ls -la
          # 不假设顶层目录名：把解压出来的文件平铺到 models/
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -exec rm -rf {} +
          rm -f model.tar.bz2
          echo '--- 最终模型文件 ---'
          ls -lh
          # 缺文件就早失败，别等到运行时才炸
          for f in encoder-epoch-99-avg-1.int8.onnx decoder-epoch-99-avg-1.int8.onnx joiner-epoch-99-avg-1.int8.onnx tokens.txt; do
            if [ ! -f "$f" ]; then echo "缺少模型文件: $f"; exit 1; fi
          done

      - name: Write local.properties
        working-directory: android
        env:
          # 没配 secret 时为空串：编译照过，只是运行时请求会失败
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "deepseek.api.key=${DEEPSEEK_API_KEY}" > local.properties
          echo "local.properties written (key length: ${#DEEPSEEK_API_KEY})"

      - name: Build debug APK
        working-directory: android
        run: |
          # Windows 上提交的文件会丢执行位
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tingke-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
